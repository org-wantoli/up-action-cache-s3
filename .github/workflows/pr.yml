name: PR Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'main'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Download dependencies
        run: go mod download

      - name: Build linux binary
        run: |
          mkdir -p dist
          env GOOS=linux GOARCH=amd64 go build -o dist/linux
          chmod +x dist/linux
